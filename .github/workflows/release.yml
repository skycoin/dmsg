name: Release
# only trigger on pull request closed events
on:
  push:
    tags:
      - '*'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.*
      - uses: actions/checkout@v5
      - name: Install Requirements
        run: |
          sudo apt update
          sudo snap install goreleaser --classic
          make dep-github-release
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release

  darwin:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.*
      - uses: actions/checkout@v5
      - name: Install Requirements
        run: |
          brew install goreleaser
          brew install jq
          brew install wget
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-darwin

  windows:
    needs: darwin
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.*
      - uses: actions/checkout@v5
      - name: Install Requirements
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/goreleaser/goreleaser/releases/download/v2.12.2/goreleaser_Windows_x86_64.zip" -OutFile goreleaser.zip
          Expand-Archive goreleaser.zip
          choco install make
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release-windows

on: [pull_request]
name: Test
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
      - uses: actions/checkout@v3
      - name: Install Requirements
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/main/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.4.0
          go mod vendor
      - name: Checking Format and Testing
        run: make check
      - name: Build
        run: make build

  darwin:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
      - uses: actions/checkout@v3
      - name: Install Requirements
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/main/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.4.0
          go mod vendor
      - name: Checking Format and Testing
        run: make check
      - name: Build
        run: make build

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
      - uses: actions/checkout@v3
      - name: Install Requirements
        run: |
          choco install make
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.4.0
          go mod vendor
      - name: Testing
        run:  |
          set GO111MODULE=on
          make test-windows
      - name: Build
        run: make build-windows

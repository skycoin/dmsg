on: [pull_request]
name: Test

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Checking Format and Testing
        run: make check

      - name: Build
        run: make build

      - name: Build E2E Docker Images
        run: make test-e2e-build

      - name: Start E2E Environment
        run: make test-e2e-run

      - name: Run E2E Tests
        run: make test-e2e-test

      - name: Show E2E Logs on Failure
        if: failure()
        run: cd docker && docker compose -f docker-compose.e2e.yml logs

      - name: Stop E2E Environment
        if: always()
        run: make test-e2e-clean

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Checking Format and Testing
        run: make check

      - name: Build
        run: make build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Requirements
        run: choco install make

      - name: Testing
        run: |
          set GO111MODULE=on
          make test-windows

      - name: Build
        run: make build-windows
